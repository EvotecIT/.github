name: Setup .NET from the official CDN
description: Run the verified PowerForge SDK setup payload without downloading its full source repository.
inputs:
  dotnet-version:
    description: SDK version, channel, or newline-separated SDK versions.
    required: false
  global-json-file:
    description: Optional global.json path, added to the requested SDK versions.
    required: false
  dotnet-quality:
    description: Optional GA or preview SDK quality.
    required: false
  architecture:
    description: SDK architecture; defaults to the runner architecture.
    required: false
outputs:
  dotnet-version:
    description: Highest selected SDK version.
  dotnet-root:
    description: Directory containing the selected SDKs.
runs:
  using: node24
  main: bootstrap.cjs
